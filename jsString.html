<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string implementation</title>
    <script>
        let a="hello";
        let b = new String("world");
        document.write(a+ "<br>");
        document.write(b+ "<br>");
        let c=a.indexOf("l");
        document.write(c+ "<br>");
        let d=a.lastIndexOf("l");
        document.write(d+ "<br>");
    </script>
</head>
<body>
    
</body>
</html>
